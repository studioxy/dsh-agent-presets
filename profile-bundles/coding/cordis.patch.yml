# Agent preset `coding`: the legacy ~/.dsh/.agent-presets/coding preset,
# migrated to a bundle patch. preset.yml supplied name, description and order;
# agent.cordis.yml supplied the plugin list below, carried verbatim except for
# two deliberate edits:
#
#   1. skill-filesystem gained customSkillDirs pointing at the preset's own
#      skill directory. The default roots cover the repository and the user
#      DSH root, not the preset directory, so the preset's thirty-eight skills
#      would not mount without it. The legacy directories stay in place and
#      are referenced by absolute path; `includeDefaultRoots` keeps its default
#      `true`, so the repository's .dsh/skills still load in every preset.
#   2. workflow-worker-thread became workflow-ptc. The legacy package name
#      @deepseek-ai/dsh-workflow-worker-thread no longer exists in the current
#      DSH; the shipped standard preset mounts @deepseek-ai/dsh-workflow-ptc
#      with the same `provider: spawn` config, which is what this row does now.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition keeps everything a preset must not own: the registries
# themselves, the sandbox and approval stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

- insert:
    - id: preset-coding
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: coding
        name: Software engineering
        description: "General software engineering in Python, TypeScript and Go. Engineering methodology and repository orientation, Serena for symbol-level code intelligence and context7 for current library documentation. Carries none of the Power BI or documentation tooling."
        order: 30
        plugins:

          # ── identity ────────────────────────────────────────────────────────────

          # The preset's own persona, shadowing the deployment default for this
          # agent. `{{model}}` and `{{cwd}}` resolve from the agent's own route and
          # workspace.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: >-
                You are a software engineering agent powered by the {{model}} model. You work in existing repositories, mostly in Python, TypeScript and Go. Read before you write, change as little as the task needs, and verify with the project own tests. Serena supplies symbol-level code intelligence - prefer get_symbols_overview and find_symbol over reading whole files, and call find_referencing_symbols before changing a symbol. Note the local toolchain: there is no JDK, Maven or Gradle installed, so Java work needs one first; Python on PATH belongs to an unrelated virtualenv, so create a project environment with uv rather than installing into it.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ───────────────────────────────────────────────────────────────

          # `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects
          # it to publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects
          # a service is the criterion for host-plane ownership — injection
          # resolves before any session exists, so there is no agent to key by.
          # Behind a preset realm those variables never reached the model's shell
          # at all. Both shell tools consume the host registry from here; their
          # executors (`bash-sandbox`/`pwsh-sandbox`) are host-plane too.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────

          # Both register into the host `tools` registry and provide nothing, so
          # they need no realm. The `fs` service and its policy stay in the host.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ─────────────────────────────────────────────────────

          # Only the model-facing controls. The task REGISTRY stays on the host
          # plane: its producers sit outside any realm this file could put it in —
          # `tool-bash` above resolves it with `ctx.get`, and an entry-local realm
          # here is invisible to every sibling row, so `run_in_background` would
          # answer "background jobs unavailable" while these controls sat in the
          # catalog. The registry is keyed by owning agent anyway, so one host
          # instance serves every session. What a preset chooses is whether its
          # agent can collect and stop background work at all.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ──────────────────────────────────────────────────────────────

          # The skill REGISTRY lives in the host composition and is layered per
          # scope: these rows register into THIS preset's layer of it, so they need
          # no realm. `skill-filesystem` contributes local-root discovery for
          # agents on this preset, and `tool-skill` gives them the catalog and
          # loader; the merged catalog also carries whatever the deployment
          # registered globally (repository plugins).
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              # The preset's own skills, mounted from the legacy directory by
              # absolute path: the default roots do not cover the preset directory.
              # The legacy directory stays where it is.
              customSkillDirs:
                - 'C:\Users\andrz\.dsh\.agent-presets\coding\skills'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ───────────────────────────────────────────────────────────────

          # The goal service and session driver stay on the host plane, where the
          # Gateway can resolve them. The human command and model-facing tool
          # register into this preset's scoped layers.
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ───────────────────────────────────────────────────────────

          # Plan state is per-agent by nature, so an entry-local realm is not a
          # workaround here — it is the correct lifetime.
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ──────────────────────────────────────────────────────────

          # `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the
          # pruner must share this realm rather than sit outside it.
          #
          # `tokenMeter` is deliberately NOT in this realm: the meter stays on the
          # HOST plane, and the rows here resolve that one instance. It takes no
          # configuration, keys every fold by Session, and owns the context-meter
          # projection units the browser reads for every session — behind a realm
          # those units would come and go with whichever presets happen to be
          # mounted. What a preset chooses is whether its agent compacts at all,
          # which is `compaction-basic` below.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ────────────────────────────────────────────

          # The `subagents` registry and its spawn/fork backends live in the HOST
          # composition: the registry is a process singleton whose cross-session
          # queries the api-proxy serves to the browser, and a provider name may
          # only be registered once. This preset contributes the delegation TOOLS,
          # which resolve that host registry.
          #
          # `workflows` is different — nothing outside an agent reads it — so every
          # row that reaches it shares one entry-local realm here, and a consumer
          # left outside would resolve a host registry this preset does not
          # populate.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable

              # Fork omits model selection so provider/model stay equal to the
              # parent and the inherited history remains eligible for KV Cache
              # reuse. This preset keeps fork continuable; parent and child inherit
              # the same messaging tool, while the parent id and return guidance
              # follow the inherited history.
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              # Production dsh does not install these optional providers. Install
              # the matching Bundle in this Profile and restart the Host, then copy
              # this preset and remove `disabled` from the matching tool row. Host
              # availability alone grants no tool.
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              # Renamed from workflow-worker-thread (edit 2 in the header): same
              # `provider: spawn` config the legacy row carried.
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ─────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # The `web` service and its search provider stay in the host
          # composition; only the model-facing tool is per-session.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          # ── MCP: code intelligence and current documentation ────────────────────

          # Serena, with a custom context that limits it to eleven LSP-backed tools. Serena loads 52
          # tools internally and exposes 29 by default; the context cuts both down. The excluded ones duplicate native capabilities: read_file,
          # create_text_file, find_file, list_dir, search_for_pattern and replace_content all have purpose
          # built equivalents in this harness, and the six memory tools duplicate the filesystem and the
          # skill catalogue. Verified before mounting: the context resolves, the server starts
          # (Serena v1.28.1), and get_symbols_overview returned a real symbol map of a project file.
          #
          # The project path below is literal on purpose. DSH resolves {{model}}/{{cwd}} only in persona
          # and instruction text and in the ACP/SDK profiles; an MCP row's args are plain strings to
          # dsh-mcp-client. With '{{cwd}}' Serena started without a project and all twelve tools it then exposed answered
          # "No active project" (logged as "Error activating project '{{cwd}}' at startup"). Serena
          # registers any real directory itself, so point this at the workspace in use; rerun
          # tools/serena-pretest/probe_serena.py after changing it.
          #
          # What is left is what the native tools cannot do: find_symbol, find_referencing_symbols,
          # find_declaration, get_symbols_overview, get_diagnostics_for_file, rename_symbol,
          # replace_symbol_body, insert_before_symbol, insert_after_symbol, safe_delete_symbol and
          # replace_in_files.
          #
          # find_implementations is deliberately absent. The Pyright backend does not implement
          # textDocument/implementation and answers -32601 Unhandled method, so the tool failed on every
          # call across all four clean pretest sessions. A tool that always fails still costs a definition
          # on every request. Add it back if the project ever moves to the JetBrains backend.
          #
          # Serena writes its logs to SERENA_HOME and starts Pyright through uvx, which takes a lock in
          # the uv cache. Both default to locations outside the workspace (~/.serena and %APPDATA%\uv), so
          # under a file sandbox that only permits workspace writes the language server dies with
          # LanguageServerTerminatedException and every call fails. The pretest worked around it by setting
          # SERENA_HOME, UV_CACHE_DIR and UV_TOOL_DIR to a directory inside the workspace. That cannot be
          # done from here: env values are literal strings and this row cannot know the workspace, the same
          # limitation that broke the project argument above. Under the current danger-full-access policy
          # the defaults are writable and none of this applies; if that policy is ever tightened, this row
          # needs those three variables pointed into the workspace, and the fix belongs in whatever starts
          # the session rather than in the preset.
          #
          # The context file lives in this preset tree at serena/contexts/dsh-coding.yml, so the preset
          # and the context it depends on are versioned together instead of drifting apart.
          - id: mcp-serena
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              transport: stdio
              serverName: serena
              command: serena
              args:
                - 'start-mcp-server'
                - '--context'
                - 'C:\Users\andrz\.dsh\.agent-presets\serena\contexts\dsh-coding.yml'
                - '--project'
                - 'D:\import road dashboard\Energy BU Logistics'
              toolCallTimeoutMs: 180000
              failOnStartupError: false

          # Current, versioned library documentation. Fills a gap in the installed
          # source-driven-development skill, which tells the agent to verify an approach against official
          # documentation and otherwise has no mechanism for it - the fallback is a web search returning
          # stale blog posts.
          - id: mcp-context7
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              transport: stdio
              serverName: context7
              command: npx
              args:
                - '-y'
                - '@upstash/context7-mcp@latest'
              toolCallTimeoutMs: 60000
              failOnStartupError: false