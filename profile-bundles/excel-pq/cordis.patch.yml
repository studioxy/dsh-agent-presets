# Agent preset `excel-pq`, authored directly as a bundle patch (there is no
# legacy ~/.dsh/.agent-presets/excel-pq composition to migrate; the source of
# this profile is a self-contained package whose README specifies the three MCP
# servers and four skills).
#
# `agent.cordis.yml.source` beside this file carries the same plugin list in
# flat form, commented, so the validator can prove the two agree and the next
# reader can see both shapes. This file is the one DSH actually loads.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition keeps everything a preset must not own: the registries
# themselves, the sandbox and approval stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's.

- insert:
    - id: preset-excel-pq
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: excel-pq
        name: Excel / Power Query
        description: "Excel workbooks and Power Query M: routing between headless file tools and the live Excel engine, safe writes with work copies and backups, SAP export intake, and M authoring conventions. Carries the excel-live, pq and excel-files MCP servers."
        order: 50
        plugins:

          # ── identity ────────────────────────────────────────────────────────────

          # The interpreter sentence in the persona is not decoration. On this
          # machine the bare `python` on PATH is another tool's virtualenv and
          # carries neither openpyxl nor pandas, while two of the skills' scripts
          # import openpyxl. Without it those commands fail with
          # ModuleNotFoundError, which reads like a broken workbook rather than a
          # missing dependency. Installing into that virtualenv is forbidden here
          # (it belongs to another tool), so the scripts run through `uv`.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: >-
                You are an Excel and Power Query agent powered by the {{model}} model. You work on .xlsx, .xlsm and
                .xlsb workbooks, their Power Query (M) queries, and SAP spreadsheet exports. Two worlds never mix.
                Headless file libraries (openpyxl, pandas, the `excel-files` server) rewrite the whole package and
                delete whatever they do not understand — Power Query, connections, the data model, slicers and VBA
                are all lost on save. The live Excel engine (the `excel-live` server) leaves what it does not touch
                intact and can refresh queries and recalculate. So route before you write: apply the
                `excel-pq-routing` skill to a workbook before the first write, and `xlsx-safety` before any write at
                all. The `pq` server analyses and edits M without Excel; never let `pq` and `excel-live` write the
                same workbook at once — name which server owns the file before editing it. On this machine the bare
                `python` is another tool's virtualenv with neither openpyxl nor pandas, so any skill script that
                imports openpyxl must be run as `uv run --with openpyxl python <script>`; `inspect_workbook.py` and
                `make_work_copy.py` are standard-library-only and run under plain `python`.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ───────────────────────────────────────────────────────────────

          # `shell-env` stays in the HOST composition: a host row that injects a
          # service is the criterion for host-plane ownership. Both shell tools
          # consume the host registry from here; their executors
          # (`bash-sandbox`/`pwsh-sandbox`) are host-plane too. Excel work is
          # Windows-only in practice, so `tool-pwsh` is the live row.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────

          # Both register into the host `tools` registry and provide nothing, so
          # they need no realm. The `fs` service and its policy stay in the host.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ─────────────────────────────────────────────────────

          # Only the model-facing controls; the task REGISTRY stays on the host
          # plane. This matters here: a Power Query refresh or a `pq` evaluation
          # can run for minutes, so the agent needs `run_in_background` and a way
          # to collect it.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ──────────────────────────────────────────────────────────────

          # The skill REGISTRY lives in the host composition and is layered per
          # scope: these rows register into THIS preset's layer of it, so they
          # need no realm. `customSkillDirs` is REQUIRED and fails silently
          # without it — the default roots cover the repository and the user DSH
          # root, but not a preset directory, so the four skills would not mount
          # at all while the preset still looked healthy. `includeDefaultRoots`
          # keeps its default `true`, so a target repository's own .dsh/skills
          # still load.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - 'C:\Users\andrz\.dsh\.agent-presets\excel-pq\skills'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ───────────────────────────────────────────────────────────────

          # The goal service and session driver stay on the host plane, where the
          # Gateway can resolve them. The human command and model-facing tool
          # register into this preset's scoped layers.
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ───────────────────────────────────────────────────────────

          # Plan state is per-agent by nature, so an entry-local realm is not a
          # workaround here — it is the correct lifetime.
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ──────────────────────────────────────────────────────────

          # `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the
          # pruner must share this realm rather than sit outside it. `tokenMeter`
          # stays on the HOST plane and is deliberately NOT in this realm.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ────────────────────────────────────────────

          # The `subagents` registry and its spawn/fork backends live in the HOST
          # composition. This preset contributes the delegation TOOLS, which
          # resolve that host registry. `workflows` is different — nothing outside
          # an agent reads it — so every row that reaches it shares one
          # entry-local realm here.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ─────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # The `web` service and its search provider stay in the host
          # composition; only the model-facing tool is per-session. Kept because
          # M function signatures and Excel behaviour are looked up far more
          # often than they are remembered.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          # ── MCP: the three servers the profile is built around ──────────────────

          # `dsh-mcp-client` publishes no service, so these are plain rows and
          # need no `isolate` realm. All three are fail-soft: a server that will
          # not start costs its own tools and not the session.
          #
          # Tool counts are MEASURED, not documented — each server was started
          # through the MCP handshake and asked for `tools/list`:
          #
          #   excel-live   npx -y @sbroenne/mcp-server-excel       -> 31 tools
          #   pq           uvx letin                               -> 31 tools
          #   excel-files  uvx excel-mcp-server stdio (read-only)  ->  7 tools
          #
          # 69 tools total, a real context cost, and the reason the routing skill
          # exists: the agent is expected to reach for the cheapest server that
          # answers the question rather than for all three. Do not add a second
          # full Excel server (ThepExcelMCP and friends) beside `excel-live`.
          #
          # `{{cwd}}` is NOT interpolated in an MCP row, which is why every path
          # below is literal.

          # The engine that can actually refresh and recalculate. Its
          # `powerquery`, `datamodel`, `connection`, `slicer`, `pivottable` and
          # `vba` operation groups are what the headless path cannot substitute
          # for. Timeout is generous because a refresh legitimately runs past 30s;
          # a timeout is not proof of failure.
          - id: mcp-excel-live
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              transport: stdio
              serverName: excel-live
              command: npx
              args:
                - '-y'
                - '@sbroenne/mcp-server-excel'
              toolCallTimeoutMs: 240000
              failOnStartupError: false

          # The M specialist. Reads queries out of a CLOSED workbook without
          # starting Excel (it parses the DataMashup part), which is what makes
          # lint, dependency graph and diff possible at all. It writes through
          # Excel when asked to, which is why the one-writer-at-a-time rule in
          # the persona exists.
          - id: mcp-pq
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              transport: stdio
              serverName: pq
              command: uvx
              args:
                - letin
              toolCallTimeoutMs: 240000
              failOnStartupError: false

          # Read-only file access with no Excel involved. `EXCEL_MCP_READ_ONLY=1`
          # is the posture the profile wants; setting it to 0 would give this
          # server a second write path into the same files the other two own.
          # `EXCEL_FILES_PATH` is the server's own root and must be literal — it
          # is the machine-specific value in this file, and C:\xlsx is created
          # for it.
          - id: mcp-excel-files
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              transport: stdio
              serverName: excel-files
              command: uvx
              args:
                - excel-mcp-server
                - stdio
              env:
                EXCEL_MCP_READ_ONLY: '1'
                EXCEL_FILES_PATH: 'C:\xlsx'
              toolCallTimeoutMs: 120000
              failOnStartupError: false
